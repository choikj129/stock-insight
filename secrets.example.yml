# 비밀값 파일 예시. 이 파일에는 값을 넣지 않는다.
#
# 실제 파일 위치 (저장소 밖):
#   로컬(Windows): C:\Users\<사용자>\.stockinsight\secrets.yml
#   운영(서버):    /etc/stockinsight/secrets.yml  (소유자만 읽기, chmod 600)
#   다른 위치를 쓰려면 환경 변수 STOCKINSIGHT_SECRETS에 경로를 지정한다.
#
# 키 이름은 환경 변수 이름과 같다. 같은 이름의 환경 변수가 있으면 환경 변수가 우선한다.

# OpenDART 인증키 (로컬·운영)
DART_API_KEY:

# Anthropic(Claude) 인증키 (로컬·운영, AI 분석용). 개발용·운영용 키를 분리하는 것을 권장한다(ai-analysis.md §8).
ANTHROPIC_API_KEY:

# 운영 DB 접속 정보 (운영만. 로컬은 compose.yaml의 개발용 DB를 쓴다)
# DB_URL: jdbc:postgresql://<host>:5432/stockinsight
# DB_USERNAME:
# DB_PASSWORD:
