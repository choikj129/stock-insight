# 모든 환경 공통 설정. 환경별 값은 application-{profile}.yml에 둔다.
spring:
  application:
    name: stockInsight
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 관리한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # 시각은 UTC로 저장한다 (docs/architecture.md §4.3).
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

app:
  scheduler:
    enabled: false
  dart:
    api-key: ${DART_API_KEY:}
    base-url: https://opendart.fss.or.kr/api
    min-interval: 200ms
    connect-timeout: 5s
    # 고유번호 파일(zip)은 수 MB이므로 넉넉히 둔다.
    read-timeout: 60s
    max-attempts: 3
    retry-backoff: 2s
  ingest:
    company-sync:
      cron: "0 0 5 * * *"
      run-on-startup: false
      max-calls-per-run: 10000
      refresh-after: 30d
      min-listed-count: 1000
      max-delisted-ratio: 0.1
    disclosure-sync:
      # 전체 실행은 기업 목록 동기화(05:00) 뒤에 전날을 확정하고 초기 적재를 이어 받는다.
      cron: "0 0 6 * * *"
      intraday-cron: "0 */30 8-19 * * MON-FRI"
      run-on-startup: false
      # 초기 적재 3년 ≈ 3,300일·유형 + 추가 페이지. 두어 번의 실행에 나눠 받는다.
      max-calls-per-run: 3000
      initial-load-period: 3y
    financial-sync:
      # 공시 목록 수집(06:00) 뒤 하루 한 번. 장중에는 하지 않는다.
      cron: "0 30 6 * * *"
      run-on-startup: false
      max-calls-per-run: 500
      # 올해 포함 4개 bsns_year(올해, 올해-1, 올해-2, 올해-3) × 4개 보고서 종류.
      initial-load-years: 3
  signal:
    financial-signal:
      # 재무 수집(06:30) 뒤 하루 한 번.
      cron: "0 0 7 * * *"
      run-on-startup: false
  analysis:
    financial-explain:
      # 재무 신호 계산(07:00) 뒤.
      cron: "0 30 7 * * *"
      run-on-startup: false
      golden-set-company-ids: []
      daily-budget-usd: 5
      monthly-budget-usd: 60
      # 골든셋 검토를 통과하기 전까지는 초안으로만 저장한다(D-39, ai-analysis.md §4.4.8).
      publish: false
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-5
    max-tokens: 2000
    timeout: 60s
    max-retries: 2
    # ai-analysis.md §9 (2026-06 기준, 100만 토큰당 USD).
    input-cost-per-million: 2
    cache-read-cost-per-million: 0.2
    output-cost-per-million: 10

management:
  endpoints:
    web:
      exposure:
        include: health
