# 로컬 개발용 PostgreSQL. 운영은 RDS를 사용한다.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stockinsight
      POSTGRES_USER: stockinsight
      POSTGRES_PASSWORD: stockinsight
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockinsight -d stockinsight"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
